# DSH bundle entry. OpenMetadata is registered with the bundle and enables
# itself only when the host provides a read-only token through its environment.
- insert:
    - id: dsh-workbench
      name: dsh-workbench
      config:
        workspaceId: local-demo
        libraryAdapter: filesystem
        allowDevWrites: false
        # Keep the plugin on the user's established profile library.  A relative
        # path is resolved from the DSH process directory (often the user home),
        # which previously split historical boards across two libraries.
        libraryRoot: C:/Users/Administrator/.dsh/profiles/web/dsh-workbench-library

    - id: dsh-workbench-openmetadata-semantic-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.OPENMETADATA_MCP_TOKEN'
      config:
        serverName: openmetadata_semantic
        transport: streamable-http
        url: !!js "process.env.OPENMETADATA_MCP_URL || 'https://openmetadata.transsion.com/mcp'"
        headers:
          Authorization: !!js '`Bearer ${process.env.OPENMETADATA_MCP_TOKEN}`'
        # OpenMetadata is an optional semantic source. A transient network or
        # TLS failure must not prevent the local workbench itself from starting.
        # The connector remains available and is used again once it reconnects.
        failOnStartupError: false
        toolCallTimeoutMs: 60000
