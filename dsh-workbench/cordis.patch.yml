# DSH bundle entry. OpenMetadata is registered with the bundle and enables
# itself only when the host provides a read-only token through its environment.
- insert:
    - id: dsh-workbench
      name: dsh-workbench
      config:
        workspaceId: local-demo
        libraryAdapter: filesystem
        allowDevWrites: false
        libraryRoot: ./dsh-workbench-library

    - id: dsh-workbench-openmetadata-semantic-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.OPENMETADATA_MCP_TOKEN'
      config:
        serverName: openmetadata_semantic
        transport: streamable-http
        url: !!js "process.env.OPENMETADATA_MCP_URL || 'https://openmetadata.transsion.com/mcp'"
        headers:
          Authorization: !!js '`Bearer ${process.env.OPENMETADATA_MCP_TOKEN}`'
        # With a configured credential, refuse to start silently without the
        # semantic source. This guarantees the analysis agent never runs as if
        # OpenMetadata were available when discovery actually failed.
        failOnStartupError: true
        toolCallTimeoutMs: 60000
